    <script>
        const DEFAULT_PROJECTS = [
          {
                    id: '1',
                    title: '一字千金文字遊戲',
                    subtitle: '國中小文字與成語益智題庫',
                    category: '益智戲',
                    url: 'https://' + 'tangfl' + '.' + 'github' + '.' + 'io/wordgame/',
                    tags: ['字字珠璣', '將錯錯', '東拼西湊', '答'],
                    description: '涵蓋國中小成語與常用字辨析，支援多種趣味關卡與即時搶答機制。'
          },
          {
                    id: '2',
                    title: '佛光一字千金文字遊戲',
                    subtitle: '人間佛與三好四給益智題庫',
                    category: '佛光教育',
                    url: 'https://' + 'tangfl' + '.' + 'github' + '.' + 'io/buddhist-wordgame/',
                    tags: ['因緣和合', '正知正見', '三四給', '星雲大師'],
                    description: '結合人間佛教法語與文化題庫，專為佛光會與社區教育設計的文字互動遊戲。'
          },
          {
                    id: '3',
                    title: '慧慈寺 AI 應用實務研習專案',
                    subtitle: '生成式 AI 與 Prompt 工程教學',
                    category: 'AI研習',
                    url: 'https://' + 'huitzusi-ai-course' + '.' + 'vercel' + '.' + 'app',
                    tags: ['生成 AI', 'Prompt 工程', '課堂講義', '實作'],
                    description: '提供慧慈寺學之生成式 AI 應用課程講義、提示詞範本與務操作平台。'
          },
          {
                    id: '4',
                    title: 'Vercel 空間釋放與維運理',
                    subtitle: '自動化清理與 10GB 配額保障',
                    category: '維運工具',
                    url: 'https://' + 'github' + '.' + 'com/tangfl',
                    tags: ['Vercel', '自動化', '配額管理', 'DevOps'],
                    description: '自動掃描並清理歷史部署版本，協助開發者持儲存空間健康且免於超出配額。'
          },
          {
                    id: '5',
                    title: '臺灣股市智慧篩選器',
                    subtitle: '四大多空策略與法人評等量化分析',
                    category: '投資分析',
                    url: 'https://' + 'tw-stock-screener-black' + '.' + 'vercel' + '.' + 'app/',
                    tags: ['台股', '法人評等', '高股息', '估優質股', '量化選股'],
                    description: '串接 TWSE/TPEx 即數據，提供法人一致看好、百以下低估股、本益比、殖利率及目標價差深度交叉分析。'
          }
              ];
    
        let projects = JSON.parse(localStorage.getItem('spark_projects')) || DEFAULT_PROJECTS;
        let currentCategory = '全部';
        let searchQuery = '';
    
        function renderFilters() {
                const categories = ['全部', ...new Set(DEFAULT_PROJECTS.map(p => p.category))];
                const filterEl = document.getElementById('categoryFilter');
                filterEl.innerHTML = categories.map(cat => `
                        <button onclick="setCategory('${cat}')" class="px-3 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap transition ${currentCategory === cat ? 'bg-brand-600 text-white shadow-sm' : 'bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-800 hover:border-brand-500'}">
                                  ${cat}
                                          </button>
                                                `).join('');
        }
    
        function setCategory(cat) {
                currentCategory = cat;
                renderFilters();
                filterAndRender();
        }
    
        function filterAndRender() {
                const filtered = projects.filter(p => {
                          const matchesCategory = currentCategory === '全部' || p.category === currentCategory;
                          const q = searchQuery.toLowerCase();
                          const matchesSearch = !q || p.title.toLowerCase().includes(q) || p.subtitle.toLowerCase().includes(q) || p.description.toLowerCase().includes(q) || p.tags.some(t => t.toLowerCase().includes(q));
                          return matchesCategory && matchesSearch;
                });
                renderProjects(filtered);
        }
    
        function renderProjects(items) {
                const grid = document.getElementById('projectGrid');
                if (items.length === 0) {
                          grid.innerHTML = '<div class="col-span-full py-12 text-center text-slate-400 text-sm">找不到符條件的專案</div>';
                          return;
                }
                        grid.innerHTML = items.map(p => `
                                <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-5 flex flex-col justify-between hover:shadow-xl transition-all duration-300">
                                          <div>
                                                      <div class="flex items-start justify-between mb-2">
                                                                    <span class="text-xs px-2.5 py-1 bg-brand-50 dark:bg-brand-950/50 text-brand-600 dark:text-brand-400 rounded-full font-medium border border-brand-100 dark:border-brand-900">${p.category}</span>
                                                                                </div>
                                                                                            <h3 class="text-base font-bold text-slate-900 dark:text-white mb-1">${p.title}</h3>
                                                                                                        <p class="text-xs text-brand-600 dark:text-brand-400 mb-3 font-medium">${p.subtitle}</p>
                                                                                                                    <p class="text-xs text-slate-600 dark:text-slate-400 mb-4 line-clamp-2 leading-relaxed">${p.description}</p>
                                                                                                                                <div class="flex flex-wrap gap-1.5 mb-4">
                                                                                                                                              ${p.tags.map(t => `<span class="text-[10px] px-2 py-0.5 bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 rounded">#${t}</span>`).join('')}
                                                                                                                                                          </div>
                                                                                                                                                                    </div>
                                                                                                                                                                              <div class="pt-3 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between">
                                                                                                                                                                                          <a href="${p.url}" target="_blank" rel="noopener noreferrer" class="flex items-center space-x-1 text-xs font-semibold text-brand-600 dark:text-brand-400 hover:underline">
                                                                                                                                                                                                        <span>開啟專案</span>
                                                                                                                                                                                                                      <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                                                                                                                                                                                                                                  </a>
                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                          `).join('');
                lucide.createIcons();
        }
    
        document.getElementById('searchInput').addEventListener('input', (e) => {
                searchQuery = e.target.value.trim();
                filterAndRender();
        });
    
        document.addEventListener('keydown', (e) => {
                if (e.key === '/' && document.activeElement !== document.getElementById('searchInput')) {
                          e.preventDefault();
                          document.getElementById('searchInput').focus();
                }
        });
    
        document.getElementById('themeToggle').addEventListener('click', () => {
                document.documentElement.classList.toggle('dark');
        });
    
        document.getElementById('exportData').addEventListener('click', () => {
                const dataStr = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(projects, null, 2));
                const a = document.createElement('a');
                a.href = dataStr;
                a.download = 'thomas_spark_hub_backup.json';
                a.click();
        });
    
        document.getElementById('resetData').addEventListener('click', () => {
                if (confirm('確定要恢復預設專案資料嗎')) {
                          localStorage.removeItem('spark_projects');
                          projects = [...DEFAULT_PROJECTS];
                          filterAndRender();
                }
        });
    
        renderFilters();
        filterAndRender();
    </script>
